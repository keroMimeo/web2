const TEST_SIZE = 50;

function initTests() {

function render() {
  const items = currentItems();
  const q = items[current];
  const idx = globalIndex();
  const s = state[idx];

  $("jumpInput").max = items.length;
  $("jumpInput").value = current + 1;

      const role = q.type === "mc" ? "radio" : "checkbox";
      return `<div class="option ${q.type === "multi" ? "multi" : ""} ${selected ? "selected" : ""} ${o.correct ? "correct" : ""}" role="${role}" tabindex="0" aria-checked="${selected}" data-label="${o.label}"><span class="marker">${o.label}</span><span>${o.text}</span></div>`;

  }

  $("questionHost").className = "question-card" + (s.revealed ? " revealed" : "");
  $("questionHost").innerHTML = body;
  $("prevBottom").disabled = current === 0;

  $("prevBottom").addEventListener("click", prev);
  $("nextBottom").addEventListener("click", next);

function selectOption(label) {
  const q = currentItems()[current];
  const s = state[globalIndex()];
  if (q.type === "mc") s.selected = [label];
  else if (s.selected.includes(label)) s.selected = s.selected.filter(x => x !== label);
  else s.selected.push(label);

}
function updateAnswered() { renderPalette(); }

function review() {
  const items = currentItems();
  let correct = 0;
  const byObj = {};
  const missed = [];
  items.forEach((q, i) => {
    const s = state[testIndex * TEST_SIZE + i];
    let ok = false;
    if (q.type === "mc") ok = s.selected[0] === q.answer;
    else if (q.type === "multi") ok = q.answer.length === s.selected.length && q.answer.every(a => s.selected.includes(a));

  });
  const objHtml = Object.entries(byObj).map(([k,v]) => `<li>${k}: ${v.correct}/${v.total}</li>`).join("");

  $("summary").innerHTML = `<h2>Review summary</h2><p><strong>Score:</strong> ${correct}/${items.length} (${Math.round(correct*100/items.length)}%)</p><p><strong>Flagged:</strong> ${flagged}</p><h3>Per-objective breakdown</h3><ul>${objHtml}</ul><h3>Incorrect or unanswered</h3><ul>${missed.join("") || "<li>None</li>"}</ul><h3>Build validation</h3><pre>${JSON.stringify(VALIDATION, null, 2)}</pre>`;
  $("modal").classList.add("open");
  document.querySelectorAll(".jumpMiss").forEach(b => b.addEventListener("click", () => { $("modal").classList.remove("open"); current = Number(b.dataset.i); render(); }));
}
