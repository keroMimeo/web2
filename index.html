<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Spooktacular Movie Watchlist</title>
  <style>
    :root {
      --bg-color: #0f0a1c;
      --card-bg: #1d1633;
      --accent-orange: #ff7518;
      --accent-purple: #8a2be2;
      --text-color: #f1f1f1;
      --text-dim: #a0a0b0;
      --danger: #ff4d4d;
      --success: #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    /* Auth Screen */
    #auth-section { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 2px solid var(--accent-orange); width: 100%; max-width: 400px; margin-top: 100px; text-align: center; box-shadow: 0 0 20px rgba(255, 117, 24, 0.2); }
    #auth-section h1 { color: var(--accent-orange); margin-bottom: 20px; }
    
    /* Main Dashboard */
    #app-section { display: none; width: 100%; max-width: 800px; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.5rem; color: var(--accent-orange); text-shadow: 0 0 10px rgba(255, 117, 24, 0.5); }
    .countdown { font-size: 1.1rem; color: var(--accent-purple); font-weight: bold; margin-top: 5px; }

    .user-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; }
    
    /* Forms & Inputs */
    form { display: flex; flex-direction: column; gap: 12px; }
    input, select, button { padding: 12px; border-radius: 6px; border: 1px solid #332a54; background: #120c24; color: white; font-size: 1rem; }
    input:focus, select:focus { outline: 2px solid var(--accent-orange); }
    button { background: var(--accent-orange); color: #000; font-weight: bold; border: none; cursor: pointer; transition: 0.2s ease; }
    button:hover { background: #e06000; transform: translateY(-1px); }
    .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--text-dim); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

    .add-movie-card { background: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 30px; }
    .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

    /* Movie List */
    .movie-list { display: flex; flex-direction: column; gap: 15px; }
    .movie-card { background: var(--card-bg); padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--accent-purple); transition: 0.2s; }
    .movie-card.watched { border-left-color: var(--success); opacity: 0.6; }
    .movie-card.watched .movie-title { text-decoration: line-through; }
    .movie-info h3 { font-size: 1.2rem; margin-bottom: 4px; }
    .movie-meta { font-size: 0.85rem; color: var(--text-dim); }
    .movie-actions { display: flex; gap: 10px; }
    .btn-action { padding: 6px 12px; font-size: 0.85rem; }
    .btn-danger { background: var(--danger); color: white; }

    .empty-state { text-align: center; color: var(--text-dim); margin-top: 40px; }
  </style>
</head>
<body>

  <section id="auth-section">
    <h1>🎃 Spooky Login</h1>
    <p style="margin-bottom: 15px; color: var(--text-dim);">Enter your name to access your countdown watchlist.</p>
    <form id="login-form">
      <input type="text" id="username" placeholder="Enter your username" required>
      <button type="submit">Enter the Crypt</button>
    </form>
  </section>

  <section id="app-section">
    <header>
      <h1>🎃 Halloween Movie Watchlist</h1>
      <div class="countdown" id="countdown">Loading countdown...</div>
    </header>

    <div class="user-bar">
      <span>Logged in as: <strong id="user-display" style="color: var(--accent-orange);"></strong></span>
      <button class="btn-secondary btn-action" onclick="logout()">Logout</button>
    </div>

    <div class="add-movie-card">
      <h2 style="margin-bottom: 15px; font-size: 1.2rem;">Add a Spooky Movie</h2>
      <form id="movie-form">
        <input type="text" id="movie-title" placeholder="Movie Title (e.g., Hocus Pocus)" required>
        <div class="form-row">
          <input type="date" id="watch-date" required>
          <select id="platform">
            <option value="Shudder">Shudder</option>
            <option value="Netflix">Netflix</option>
            <option value="Disney+">Disney+</option>
            <option value="Prime Video">Prime Video</option>
            <option value="Hulu">Hulu</option>
            <option value="Other">Other</option>
          </select>
          <button type="submit">+ Add Movie</button>
        </div>
      </form>
    </div>

    <div id="movie-list" class="movie-list"></div>
  </section>

  <script>
    let currentUser = localStorage.getItem('ghoulish_user') || null;
    let movies = JSON.parse(localStorage.getItem('ghoulish_movies')) || [];

    // DOM Elements
    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const loginForm = document.getElementById('login-form');
    const movieForm = document.getElementById('movie-form');
    const movieList = document.getElementById('movie-list');
    const userDisplay = document.getElementById('user-display');
    const countdownEl = document.getElementById('countdown');

    // Init App
    window.onload = () => {
      initDates();
      updateCountdown();
      setInterval(updateCountdown, 60000); // Update countdown every minute

      if (currentUser) {
        showApp();
      }
    };

    // Set constraints on Date Picker (Today to Oct 31)
    function initDates() {
      const today = new Date();
      const currentYear = today.getFullYear();
      let targetYear = currentYear;
      
      // If Halloween already passed this year, set target to next year
      if (today.getMonth() > 9 || (today.getMonth() === 9 && today.getDate() > 31)) {
        targetYear++;
      }

      const todayStr = today.toISOString().split('T')[0];
      const halloweenStr = `${targetYear}-10-31`;

      const dateInput = document.getElementById('watch-date');
      dateInput.min = todayStr;
      dateInput.max = halloweenStr;
      dateInput.value = todayStr;
    }

    // Countdown Timer
    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let halloween = new Date(targetYear, 9, 31, 23, 59, 59);

      if (now > halloween) {
        targetYear++;
        halloween = new Date(targetYear, 9, 31, 23, 59, 59);
      }

      const diff = halloween - now;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      countdownEl.innerText = `⏳ ${days} days and ${hours} hours until Halloween!`;
    }

    // Auth Actions
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      currentUser = document.getElementById('username').value.trim();
      localStorage.setItem('ghoulish_user', currentUser);
      showApp();
    });

    function logout() {
      localStorage.removeItem('ghoulish_user');
      currentUser = null;
      appSection.style.display = 'none';
      authSection.style.display = 'block';
    }

    function showApp() {
      authSection.style.display = 'none';
      appSection.style.display = 'block';
      userDisplay.innerText = currentUser;
      renderMovies();
    }

    // Add Movie Action
    movieForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('movie-title').value;
      const date = document.getElementById('watch-date').value;
      const platform = document.getElementById('platform').value;

      const newMovie = {
        id: Date.now(),
        user: currentUser,
        title,
        date,
        platform,
        watched: false
      };

      movies.push(newMovie);
      saveAndRender();
      movieForm.reset();
      initDates();
    });

    // Toggle Watched Status
    function toggleWatched(id) {
      movies = movies.map(m => m.id === id ? { ...m, watched: !m.watched } : m);
      saveAndRender();
    }

    // Delete Movie
    function deleteMovie(id) {
      movies = movies.filter(m => m.id !== id);
      saveAndRender();
    }

    // Persistence
    function saveAndRender() {
      localStorage.setItem('ghoulish_movies', JSON.stringify(movies));
      renderMovies();
    }

    // Render Function
    function renderMovies() {
      movieList.innerHTML = '';
      
      // Filter movies created by logged-in user
      const userMovies = movies.filter(m => m.user === currentUser);

      if (userMovies.length === 0) {
        movieList.innerHTML = `<div class="empty-state"><p>👻 No spooky movies queued up yet!</p></div>`;
        return;
      }

      // Sort by scheduled watch date
      userMovies.sort((a, b) => new Date(a.date) - new Date(b.date));

      userMovies.forEach(movie => {
        const card = document.createElement('div');
        card.className = `movie-card ${movie.watched ? 'watched' : ''}`;
        
        // Format display date
        const formattedDate = new Date(movie.date + 'T00:00:00').toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric'
        });

        card.innerHTML = `
          <div class="movie-info">
            <h3 class="movie-title">${escapeHtml(movie.title)}</h3>
            <div class="movie-meta">📅 Scheduled: <strong>${formattedDate}</strong> | 📺 ${movie.platform}</div>
          </div>
          <div class="movie-actions">
            <button class="btn-action btn-secondary" onclick="toggleWatched(${movie.id})">
              ${movie.watched ? 'Unmark' : '✓ Watched'}
            </button>
            <button class="btn-action btn-danger" onclick="deleteMovie(${movie.id})">✕</button>
          </div>
        `;
        movieList.appendChild(card);
      });
    }

    // Sanitization utility
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
